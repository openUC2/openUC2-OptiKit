optikit-version: v0.0.0-alpha.1
design:
  name: optikit-configurator
  description: Generated by the openUC2-OptiKit configurator
components:
  camera-usb-daheng-c1:
    type: primitive
    category: detector
    primitive:
      type: step
      model: openuc2.detector.camera_cs165
    optics:
      frames:
        optical:
          z-mm: 0
        sensor:
          z-mm: -10
      ports:
        sensor:
          frame: sensor
          direction: -z
    pose:
      rotation:
        type: grid
        grid:
          z: +y
          x: -z
      translation:
        offset-grid:
          x: 2
          y: 2
          z: 0
  laser-488nm-a1:
    type: primitive
    category: source
    primitive:
      type: step
      model: openuc2.source.laser_488
    optics:
      frames:
        optical:
          z-mm: 0
        emit:
          z-mm: 20
      ports:
        out:
          frame: emit
          direction: +z
      emission:
        port: out
        spectrum:
          - wavelength_um: 0.488
            weight: 1
        spatial:
          type: disc
          radius_mm: 1
        angular:
          type: collimated
        flux: 1
    pose:
      rotation:
        type: grid
        grid:
          z: +x
          x: -z
      translation:
        anchor: camera-usb-daheng-c1
        offset-grid:
          x: -2
          y: -2
          z: 0
  mirror-1x1-m1:
    type: primitive
    category: mirror
    primitive:
      type: step
      model: openuc2.mirror.flat_45
    optics:
      fragment:
        surfaces:
          - type: standard
            geometry:
              type: StandardGeometry
              radius: .inf
              conic: 0
            interaction_model:
              type: refractive_reflective
              is_reflective: true
            semi_aperture: 12.5
      frames:
        optical:
          z-mm: 0
      ports:
        front:
          frame: optical
          direction: -z
        reflected:
          frame: optical
          direction: +x
          after-surface: 0
    pose:
      rotation:
        type: grid
        grid:
          z: +x
          x: +y
      translation:
        anchor: camera-usb-daheng-c1
        offset-grid:
          x: 0
          y: -2
          z: 0
